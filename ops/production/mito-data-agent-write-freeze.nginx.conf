# Temporary cutover ingress. GET/HEAD/OPTIONS continue to the retained v1.0.0
# service while every mutating method is rejected before it reaches Django.
# Cloudflared is pointed at 127.0.0.1:18193 only for the final backup/sync
# window; normal and rollback routes remain direct to 18191/18190.
map $request_method $mito_mutation_during_freeze {
    default 1;
    GET 0;
    HEAD 0;
    OPTIONS 0;
}

server {
    listen 127.0.0.1:18193;
    server_name mito-data-agent.seg.bio;

    if ($mito_mutation_during_freeze) {
        return 503 "Production upgrade in progress; writes are temporarily frozen.\n";
    }

    location / {
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host mito-data-agent.seg.bio;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        client_max_body_size 128m;
    }
}
