# Private pre-cutover TLS ingress for the isolated v1.1.0 service. It models
# the forwarded HTTPS contract (secure cookies, CSRF, redirect handling) while
# public cloudflared still targets v1.0.0. Remove/disable after the release.
server {
    listen 127.0.0.1:18195 ssl;
    server_name mito-data-agent.seg.bio;

    ssl_certificate /home/weidf/shenb/mito-data-agent-production-v1.1.0/run/private-validation.crt;
    ssl_certificate_key /home/weidf/shenb/mito-data-agent-production-v1.1.0/run/private-validation.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        client_max_body_size 128m;
    }
}
