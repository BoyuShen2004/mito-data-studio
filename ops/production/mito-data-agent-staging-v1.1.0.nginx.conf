server {
    listen 127.0.0.1:18194 ssl;
    server_name mito-staging-v11.local;

    ssl_certificate /home/weidf/shenb/mito-data-agent-staging-v1.1.0/run/staging.crt;
    ssl_certificate_key /home/weidf/shenb/mito-data-agent-staging-v1.1.0/run/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:18192;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        client_max_body_size 128m;
    }
}
