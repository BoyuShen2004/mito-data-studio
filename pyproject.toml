[tool.pytest.ini_options]
# Dependencies live in environment.yml. The supported test command is Django's
# runner (`python manage.py test`). pytest + pytest-django
# are NOT in environment.yml; install them yourself if you prefer pytest, and
# this section is what makes it work from the repo root.
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["backend"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/migrations/*", "*/test_*.py", "*/tests.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
